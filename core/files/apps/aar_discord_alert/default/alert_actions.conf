[discord]
is_custom = 1
label = Discord に通知
description = 検知内容を Discord の Webhook に送る
payload_format = json
python.version = python3
# Webhook URL は秘密情報なので git に入れない。サーバー上の local/alert_actions.conf に書く
param.webhook_url =
# 通知に載せるフィールド（カンマ区切り）。結果に無いものは飛ばす
param.fields = dest, user, src_user, process, command, signature_id
