# azure-attack-range: Azure + BYO Splunk (core/) + Caldera + OpenCanary の設定見本
# 使い方: このファイルを attack_range.yml にコピーして値を埋める（attack_range.yml は .gitignore 済み）
#   Copy-Item attack_range\attack_range.azure.example.yml attack_range\attack_range.yml
# 書いていないキーは configs/attack_range_default.yml の値が使われる。
#
# vCPU の内訳（Japan East、2026-11-02 時点の枠）
#   Dv4 (上限 10)  : ar-dc 4 + ar-win1 4 + ar-linux 2 = 10
#   DDv4 (上限 10) : ar-win2 4 + ar-srv 4           = 8
#   DSv5 (上限 8)  : core Splunk 4 + Caldera 2 + OpenCanary 2 = 8
#   Av2 は Japan East で在庫切れ（SkuNotAvailable、2026-11-03）なので使わない
#   リージョン合計 (上限 40)                         = 26

general:
  cloud_provider: "azure"
  attack_range_password: "CHANGE-ME"   # 全 VM 共通。12 文字以上、大小英字・数字・記号から 3 種。$ ` " ' \ は使わない
  key_name: "aar"
  attack_range_name: "ar"
  ip_whitelist: "203.0.113.10/32"      # 自宅のグローバル IP（core の allowed_source_cidrs と同じ）

azure:
  location: "japaneast"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  private_key_path: "/root/.ssh/aar.key"   # ツールボックスのボリューム aar-ssh
  public_key_path: "/root/.ssh/aar.pub"
  core_vnet_id: ""                         # core/ で terraform output -raw core_vnet_id の値

splunk_server:
  byo_splunk: "1"
  byo_splunk_ip: "10.10.1.10"              # core/ で terraform output -raw splunk_private_ip の値

caldera_server:
  caldera_server: "1"
  # azure_vm_size: "Standard_D2s_v5"       # 既定

# Windows 共通：
#   win_sysmon_config: 既定の SwiftOnSecurity.xml は ProcessAccess（EventCode 10）を記録しないので Attack Range 版を使う
#   advanced_logging : Kerberos 4768/4769、DS アクセス 4662、ログオン 4624/4625 などの監査を有効化（ESCU の AD 系ルールに必要）
# Windows 11 は Azure では「マルチテナントのホスティング権がある適格なライセンス」が前提。
windows_servers:
  - hostname: ar-dc                        # 1 台目だけ create_domain にできる
    windows_image: "windows-server-2022"
    create_domain: "1"
    win_sysmon_config: "AttackRangeSysmon.xml"
    advanced_logging: "1"
    install_caldera_agent: "1"
  - hostname: ar-win1
    windows_image: "windows-11"
    azure_image_sku: "win11-26h2-pro"      # 本家の固定値 win11-21h2-pro は Marketplace から消えている
    join_domain: "1"
    win_sysmon_config: "AttackRangeSysmon.xml"
    advanced_logging: "1"
    install_caldera_agent: "1"
  - hostname: ar-win2
    windows_image: "windows-11"
    azure_image_sku: "win11-26h2-pro"
    azure_vm_size: "Standard_D4d_v4"       # Dv4 の枠（10）を超えないよう DDv4 に逃がす
    join_domain: "1"
    win_sysmon_config: "AttackRangeSysmon.xml"
    advanced_logging: "1"
    install_caldera_agent: "1"
  - hostname: ar-srv
    windows_image: "windows-server-2022"
    azure_vm_size: "Standard_D4d_v4"
    join_domain: "1"
    win_sysmon_config: "AttackRangeSysmon.xml"
    advanced_logging: "1"
    install_caldera_agent: "1"

linux_servers:
  - hostname: ar-linux
    install_caldera_agent: "1"
    azure_vm_size: "Standard_D2_v4"        # 既定の A4_v2 は Japan East で在庫切れ

# OpenCanary（DMZ サブネット 10.0.2.0/24、専用 NSG で隔離）
# build の前に、core Splunk に index "honeypot" を作っておくこと（Splunk Web：設定 → インデックス → 新規）
opencanary_server:
  opencanary_server: "1"
  internet_exposed: "1"                    # 1: インターネットにもおとりを公開 / 0: 内部サブネットからのみ
  azure_vm_size: "Standard_D2s_v5"         # 既定の A2_v2 は Japan East で在庫切れ
  # mgmt_ssh_port: "22222"                 # 本物の sshd。ip_whitelist からのみ。22 番はおとりの SSH
  # decoy_services: "ssh:22,ftp:21,telnet:23,http:80,mssql:1433,mysql:3306,vnc:5900,redis:6379"
