---

- name: Enable Command Line Audit for Windows Sec. Events 4688
  ignore_errors: yes
  win_regedit:
    key: "HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\Audit"
    # azure-attack-range patch: upstream had "ProcessCreationinclude_tasksCmdLine_Enabled"
    # (a find-and-replace of Include -> include_tasks), so 4688 never had command lines
    value: ProcessCreationIncludeCmdLine_Enabled
    datatype: dword
    data: 1

- name: Enable New Process Creation. Events 4688
  ignore_errors: yes
  win_audit_policy_system:
    subcategory: Process Creation
    audit_type: success, failure
